<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUB Device Dashboard</title>
    <link rel="stylesheet" href="pub_web.css">
    <link rel="icon" type="image/png" href="/pub_logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        (function () {
            const saved = localStorage.getItem('pub-theme');
            const theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        }());
    </script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <img src="/pub_logo.png" alt="PUB" class="logo-img">
                    <h1>PUB Device Dashboard</h1>
                </div>
                <div class="header-actions">
                    <span class="account-name" id="accountName"></span>
                    <div class="header-status">
                        <span class="dot" id="liveDot"></span>
                        <span id="liveText" aria-live="polite">Connecting...</span>
                    </div>
                    <button class="btn btn-secondary" id="refreshBtn" type="button" title="Refresh device status">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="btn btn-primary" id="downloadAllBtn" type="button" title="Export data from all devices">
                        <i class="fas fa-file-archive"></i> Download All
                    </button>
                    <button class="btn btn-secondary" id="logoutBtn" type="button" title="Log out">
                        <i class="fas fa-sign-out-alt"></i> Log out
                    </button>
                </div>
            </div>
            <!-- <div class="header-meta">
                <span>Last checked: <strong id="lastCheck">--</strong></span>
            </div> -->
        </header>

        <main class="cards" id="cardsGrid">
            <div class="loading" id="loadingState">
                <i class="fas fa-circle-notch fa-spin"></i>
                <p>Loading devices...</p>
            </div>
        </main>
    </div>

    <div class="login-backdrop" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <form class="login-panel" id="loginForm">
            <img src="/pub_logo.png" alt="PUB" class="login-logo">
            <h2 id="loginTitle">PUB Device Dashboard</h2>
            <p>Sign in to view your authorised station data.</p>
            <label for="loginUsername">Username</label>
            <input id="loginUsername" name="username" autocomplete="username" required>
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
            <p class="login-error" id="loginError" aria-live="polite"></p>
            <button class="btn btn-send login-submit" type="submit"><i class="fas fa-sign-in-alt"></i> Sign in</button>
        </form>
    </div>

    <!-- ---- Export delivery modal ---- -->
    <div class="modal-backdrop" id="exportModal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" type="button" id="modalClose" aria-label="Close export dialog" title="Close">
                <i class="fas fa-times"></i>
            </button>
            <h3 id="modalTitle">Build an export</h3>
            <p class="modal-sub" id="modalSubtitle">Choose a date range and devices, then pick how to receive the file.</p>

            <div class="modal-field-row">
                <div class="modal-field">
                    <label for="fromDate">From</label>
                    <input id="fromDate" type="datetime-local">
                </div>
                <div class="modal-field">
                    <label for="toDate">To</label>
                    <input id="toDate" type="datetime-local">
                </div>
            </div>

            <div class="modal-field">
                <span class="modal-field-label">Devices</span>
                <div class="device-options" id="deviceOptions"></div>
                <button class="text-button" id="selectAllDevices" type="button">Select all</button>
            </div>

            <div class="modal-field">
                <span class="modal-field-label">Delivery method</span>
            </div>

            <div class="modal-options" role="radiogroup" aria-label="Delivery method">
                <label class="modal-option selected" data-method="download">
                    <input type="radio" name="delivery" value="download" checked>
                    <div class="modal-icon"><i class="fas fa-download"></i></div>
                    <div class="modal-body">
                        <strong>Download to this device</strong>
                        <span>Save the CSV / ZIP to your computer</span>
                    </div>
                </label>

                <label class="modal-option" data-method="email">
                    <input type="radio" name="delivery" value="email">
                    <div class="modal-icon"><i class="fas fa-envelope"></i></div>
                    <div class="modal-body">
                        <strong>Send by email</strong>
                        <span>Sent from PUB Dashboard via Resend</span>
                    </div>
                </label>

                <label class="modal-option" data-method="telegram">
                    <input type="radio" name="delivery" value="telegram">
                    <div class="modal-icon"><i class="fab fa-telegram"></i></div>
                    <div class="modal-body">
                        <strong>Send via Telegram</strong>
                        <span>Sent from @PUB_WETEC_SG_bot</span>
                    </div>
                </label>
            </div>

            <div class="modal-extra" id="modalEmailExtra" hidden>
                <label for="emailTo">Recipient email(s)</label>
                <input id="emailTo" type="text" placeholder="wbgtmonitoring@gmail.com, ops@wetec.sg">
                <!-- <select id="emailTemplate" aria-label="Email template">
                    <option value="shift">Shift handover</option>
                    <option value="report">Data report</option>
                    <option value="blank">Blank message</option>
                </select> -->
            </div>

            <div class="modal-extra" id="modalTelegramExtra" hidden>
                <label for="telegramChatId">Telegram chat ID</label>
                <input id="telegramChatId" type="text" placeholder="e.g. 1418525787">
                <select id="telegramTemplate" aria-label="Telegram template">
                    <option value="short">Short summary</option>
                    <option value="report">Detailed report</option>
                    <option value="blank">Blank message</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" type="button" id="modalCancel">Cancel</button>
                <button class="btn btn-send" type="button" id="modalSend">
                    <i class="fas fa-paper-plane"></i> <span>Download</span>
                </button>
            </div>
        </div>
    </div>

    <script src="pub_web.js"></script>
</body>
</html>
