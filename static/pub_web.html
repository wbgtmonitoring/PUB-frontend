<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUB Device Dashboard</title>
    <link rel="stylesheet" href="pub_web.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-microchip"></i>
                    <h1>PUB Device Dashboard</h1>
                </div>
                <div class="header-actions">
                    <div class="header-status">
                        <span class="dot" id="liveDot"></span>
                        <span id="liveText">Connecting...</span>
                    </div>
                    <button class="btn btn-secondary" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                    <button class="btn btn-primary" id="downloadAllBtn">
                        <i class="fas fa-file-archive"></i> Download All
                    </button>
                </div>
            </div>
            <div class="header-meta">
                <span>Last checked: <strong id="lastCheck">--</strong></span>
                <!-- <span>Showing: <strong id="windowText">last 2 hours</strong></span> -->
            </div>
        </header>

        <section class="export-panel" aria-labelledby="exportTitle">
            <div class="export-heading">
                <div>
                    <span class="eyebrow">Data delivery</span>
                    <h2 id="exportTitle">Build an export</h2>
                    <p>Choose a date range, devices, and how you want to receive the readings.</p>
                </div>
                <span class="export-count" id="exportCount">Ready to export</span>
            </div>
            <div class="export-grid">
                <div class="field-group date-fields">
                    <label for="fromDate">From</label>
                    <input id="fromDate" type="datetime-local">
                    <label for="toDate">To</label>
                    <input id="toDate" type="datetime-local">
                </div>
                <div class="field-group device-filter">
                    <span class="field-label">Devices</span>
                    <div class="device-options" id="deviceOptions"></div>
                    <button class="text-button" id="selectAllDevices" type="button">Select all</button>
                </div>
                <div class="field-group delivery-field">
                    <label for="deliveryMethod">Send or download</label>
                    <select id="deliveryMethod">
                        <option value="download">Download on this device</option>
                        <option value="email">Send by email</option>
                        <option value="telegram">Send via Telegram</option>
                    </select>
                    <div id="emailFields" class="delivery-extra" hidden>
                        <input id="emailTo" type="email" placeholder="recipient@example.com" aria-label="Recipient email">
                        <select id="emailTemplate" aria-label="Email template">
                            <option value="shift">Shift handover</option>
                            <option value="report">Data report</option>
                            <option value="blank">Blank message</option>
                        </select>
                    </div>
                    <button class="btn btn-export" id="exportBtn" type="button">
                        <i class="fas fa-file-export"></i> <span>Prepare export</span>
                    </button>
                </div>
            </div>
        </section>

        <main class="cards" id="cardsGrid">
            <div class="loading" id="loadingState">
                <i class="fas fa-circle-notch fa-spin"></i>
                <p>Loading devices...</p>
            </div>
        </main>
    </div>

    <script src="pub_web.js"></script>
</body>
</html>
